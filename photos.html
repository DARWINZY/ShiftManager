<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <script>if(/github\.io$/.test(location.hostname))location.replace("https://next9-web.vercel.app/duty/"+location.pathname.replace(/^\/ShiftManager\/?/,"")+location.search+location.hash)</script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#8f0a0a">
  <meta name="description" content="ดูรูปหลักฐานเวรประจำวัน แยกตามวัน">
  <title>รูปเวร — เวรประจำวัน</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="css/styles.css?v=3.2.1">
</head>
<body class="page-files">
  <header class="hero hero-slim">
    <div class="hero-inner is-wide">
      <div class="hero-row">
        <a class="chip-btn" href="dashboard.html" id="backLink"><i class="fas fa-arrow-left"></i> ลงเวร</a>
        <a class="chip-btn" id="openWeb" target="_blank" rel="noopener"><i class="fas fa-arrow-up-right-from-square"></i> เปิดใน /photos</a>
      </div>
      <h1><i class="fas fa-images"></i> รูปเวร</h1>
    </div>
  </header>

  <main class="main is-wide">
    <div class="card card-flush files">
      <div class="files-bar">
        <nav class="crumbs" id="crumbs" aria-label="ตำแหน่ง"></nav>
        <div class="files-tools">
          <div class="search search-sm">
            <i class="fas fa-magnifying-glass"></i>
            <input type="search" id="q" class="input" placeholder="ค้นหา" autocomplete="off">
          </div>
          <button type="button" class="seg-btn" id="mineBtn" hidden><i class="fas fa-user"></i> ของฉัน</button>
          <div class="seg" role="group" aria-label="เรียง">
            <button type="button" data-sort="new" title="ใหม่ก่อน"><i class="fas fa-arrow-down-wide-short"></i></button>
            <button type="button" data-sort="old" title="เก่าก่อน"><i class="fas fa-arrow-up-short-wide"></i></button>
            <button type="button" data-sort="name" title="ตามชื่อ"><i class="fas fa-arrow-down-a-z"></i></button>
          </div>
          <div class="seg" role="group" aria-label="มุมมอง">
            <button type="button" data-view="grid" title="แบบตาราง"><i class="fas fa-table-cells-large"></i></button>
            <button type="button" data-view="list" title="แบบรายการ"><i class="fas fa-list"></i></button>
          </div>
          <div class="seg" role="group" aria-label="ขนาด">
            <button type="button" data-size="s" title="เล็ก">S</button>
            <button type="button" data-size="m" title="กลาง">M</button>
            <button type="button" data-size="l" title="ใหญ่">L</button>
          </div>
        </div>
      </div>
      <div class="files-info" id="info"></div>
      <div id="files" class="file-view"></div>
    </div>
    <p class="foot">สภานักเรียน · v3.0</p>
  </main>

  <!-- Lightbox -->
  <div class="lb" id="lb" hidden>
    <div class="lb-top">
      <div class="lb-name" id="lbName"></div>
      <a class="lb-btn" id="lbDl" title="ดาวน์โหลดต้นฉบับ"><i class="fas fa-download"></i></a>
      <button type="button" class="lb-btn" id="lbClose" title="ปิด"><i class="fas fa-xmark"></i></button>
    </div>
    <button type="button" class="lb-nav lb-prev" id="lbPrev" aria-label="รูปก่อน"><i class="fas fa-chevron-left"></i></button>
    <img id="lbImg" alt="">
    <button type="button" class="lb-nav lb-next" id="lbNext" aria-label="รูปถัดไป"><i class="fas fa-chevron-right"></i></button>
    <div class="lb-count" id="lbCount"></div>
  </div>

  <script src="js/config.js?v=3.2.1"></script>
  <script src="js/data.js?v=3.2.1"></script>
  <script src="js/auth.js?v=3.2.1"></script>
  <script src="js/api.js?v=3.2.1"></script>
  <script src="js/photos.js?v=3.2.1"></script>
</body>
</html>
